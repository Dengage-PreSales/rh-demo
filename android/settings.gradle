// The companion app to the rh-demo storefront: same catalogue, same store
// logic, same Dengage account, plus the two things only a phone can show,
// push notifications and geofence triggers.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // The Dengage Android SDK is distributed through JitPack.
        maven { url 'https://jitpack.io' }
    }
}
rootProject.name = "Dengage eComm Demo"
include ':app'
