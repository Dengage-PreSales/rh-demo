# The Dengage Mobile App Integration Key, exactly as the panel displays it.
# The panel escapes some characters in the key it shows (_s_l_ for a slash,
# _p_l_ for a plus, _e_q_ for an equals). It is stored verbatim on purpose:
# the value the panel hands you is the value the SDK is given, and the app's
# debug screen shows whether the device registered, which is the only test
# that matters. If registration never succeeds, the decoded form is the first
# thing to try, and android/README.md explains how.
#
# This key ships inside every APK by nature, the same way the web SDK's app
# guid is visible in the storefront's page source, so it is client
# configuration rather than a secret.
